spring:
  flyway:
    enabled: false   # Mapper/Service/Controller IT 不需要 Flyway，由 PerformanceFlywayTestBase 覆盖启用
  datasource:
    url: jdbc:mysql://localhost:3306/onepl?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
  main:
    allow-bean-definition-overriding: true
  cache:
    # 测试环境默认禁用缓存, 单元/集成测试不依赖 Redis 缓存行为;
    # 需要测缓存的用例可在类上 @ImportAutoConfiguration(RedisCacheAutoConfiguration.class) 覆盖
    type: none

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.bank.branch.platform.performance: DEBUG
    org.mybatis: INFO
    org.springframework.jdbc: INFO
    org.springframework.transaction: INFO
