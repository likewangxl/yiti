# ============================================================
# Lead E2E Profile
# Phase 2 (b) lead_approve_v1 真 BPMN 端到端 IT 用
# 基于 application-flowable-e2e.yml，叠加 customer-marketing 表 schema 和数据
# H2 内存库 + Flowable 嵌入式（不切真 MySQL）
# ============================================================
server:
  port: 0

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:lead-e2e;DB_CLOSE_DELAY=-1;MODE=LEGACY;NON_KEYWORDS=DAY,READ
    username: sa
    password:
    type: com.zaxxer.hikari.HikariDataSource
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
  sql:
    init:
      mode: embedded
      schema-locations: classpath:schema.sql,classpath:customer-marketing-schema.sql
      data-locations: classpath:data.sql,classpath:lead-e2e-data.sql
      encoding: UTF-8
      continue-on-error: true

flowable:
  history-level: audit
  database-schema-update: true
  process-definition-location-prefix: classpath*:/bpmn/
  process-definition-location-suffixes:
    - '**.bpmn20.xml'
  idm:
    enabled: false
  app:
    enabled: false
  eventregistry:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false
  form:
    enabled: false

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.bank.branch.platform: DEBUG
    org.flowable: INFO
    root: INFO
