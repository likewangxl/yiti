# 开发环境专属配置
spring:
  data:
    redis:
      # 与 lf/yiti（用 db 0）隔离，避免缓存反序列化冲突（ClassCastException）
      database: 1
  session:
    redis:
      # session key 前缀也隔离，免得跟 lf cookie 串
      namespace: spring:session:wangyq
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      web-stat-filter:
        enabled: true
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 5000

# CORS 由 CorsConfig (@Profile("dev")) 自动生效

logging:
  level:
    com.bank.branch.platform: DEBUG
    org.mybatis: DEBUG
