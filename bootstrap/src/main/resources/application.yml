server:
  port: 18080
  servlet:
    context-path: /

# 华为云 OBS 对象存储（统一文件存储）—— 凭证为 xanpd 占位，部署时替换为本项目 OBS 资源
obs:
  endPoint: obs.sh-dev.oshxccloud.spdbdev.com
  accessKey: QAU28T7BR57S2ENQDDNP
  secretKey: V87zaTAZM7NvESzL2dJB3HIVvAmf3xmYT5fkffSX
  bucketName: xanpd-kf-bucket-01
  presignExpireSeconds: 600

spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      # 自由报表/数据导入等上传上限，与 governance FileService 的 50MB 校验对齐（默认仅 1MB）
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # V1.6 时区修复：sessionVariables=time_zone=+08:00 强制每个 JDBC 连接 SET session time_zone=+08:00
    # 让 mapper xml 里的 NOW() 落库为北京时间（之前 DB 服务器在 PDT 时区）
    url: jdbc:mysql://localhost:3306/yiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&sessionVariables=time_zone%3D%27%2B08%3A00%27
    username: root
    password: djdev
    druid:
      # GoldenDB(分布式库)上 SPRING_SESSION 行锁争用致登录卡死(Lock wait timeout)：
      # 用 READ COMMITTED 消除范围扫描(每分钟过期清理 DELETE ... WHERE EXPIRY_TIME<?)的 gap/next-key 锁，
      # 缓解与登录 session 写(UPDATE SPRING_SESSION)的争抢。GoldenDB/MySQL 通用、可回退。
      connection-init-sqls:
        - SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
  session:
    # 去 Redis 后改 Spring Session JDBC：session 落 MySQL SPRING_SESSION 表
    # 多实例 docker 部署下天然共享，性能比 redis 慢 1-3ms 无感
    store-type: jdbc
    timeout: 7200s
    jdbc:
      initialize-schema: never    # 表手工建（docs/superpowers/sql/2026-05-20-remove-redis-init.sql）
      table-name: SPRING_SESSION
  quartz:
    enabled: true
    job-store-type: jdbc
    auto-startup: true
    startup-delay: 10s                                      # 应用启动 10s 后再启动调度，避免与启动期 syncJobsOnStartup 抢资源
    overwrite-existing-jobs: true                           # JobDetail/Trigger 配置变更后启动期可覆盖 QRTZ_* 数据
    wait-for-jobs-to-complete-on-shutdown: true             # 优雅关闭：等待运行中 Job 完成
    jdbc:
      initialize-schema: never                              # DDL 由 docs/schema/ddl-quartz.sql 手动初始化
    properties:
      org.quartz.scheduler.instanceName: BranchPlatformScheduler
      org.quartz.scheduler.instanceId: AUTO                 # 自动生成节点 ID
      org.quartz.threadPool.threadCount: 5
      org.quartz.threadPool.threadPriority: 5
      # 注：org.quartz.jobStore.class 不显式声明 —— 让 SchedulerFactoryBean.afterPropertiesSet
      # 通过 putIfAbsent 注入 LocalDataSourceJobStore（JobStoreCMT 子类，与 JobStoreTX 同源
      # 自 JobStoreSupport，支持 isClustered/tablePrefix/misfireThreshold；显式 JobStoreTX 会
      # 阻挡此路径并要求手动配置 jobStore.dataSource，与 spring-boot 的 setDataSource customizer 冲突）
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.jobStore.misfireThreshold: 60000
flowable:
  history-level: audit
  process-definition-location-prefix: classpath*:/bpmn/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"
  idm:
    enabled: false
  database-schema-update: true
  # 禁用不需要的引擎，避免多引擎共享 ACT_GE_PROPERTY 表时 Liquibase 执行时序冲突
  app:
    enabled: false
  eventregistry:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false
  form:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.bank.branch.platform: DEBUG
    root: INFO

knife4j:
  enable: true
  setting:
    language: zh_cn

platform:
  slow-sql-threshold-ms: 5000
  method-timing-warn-ms: 500
  method-timing-error-ms: 5000
  # SOAP 网关 Netty 服务端口（独立于 server.port，由 SoapNettyServer 绑定）。
  # 注意：此处是唯一生效来源——原 soap-gateway-center/application-soap.yml 不会被 Spring Boot 加载（已删除）。
  # 单机多开（同一台机起第二个实例）时，第二个实例须用命令行覆盖此端口，例如
  #   --platform.soap.netty.port=30523，否则 30522 端口冲突会导致整个上下文启动失败。
  soap:
    netty:
      port: 30522
      boss-threads: 1
      worker-threads: 4
      max-content-length: 10485760
      read-idle-seconds: 60
      log-request: true

perf:
  scheduler:
    health-check:
      enabled: false
    startup-sync:
      enabled: false
  eval:
    import:
      # 评价任务导入：单次 batchInsert 最大条数（超过则分批写入，规避 max_allowed_packet）
      batch-insert-size: 1000
      # 评价任务导入：错误数据超过该条数时不返回 JSON，改为生成错误明细 CSV 文件供下载
      error-csv-threshold: 100

auth:
  user:
    default-password: Branch@2026
    max-batch-ids: 50
