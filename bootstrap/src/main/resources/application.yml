server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/onepl?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
    timeout: 7200s
flowable:
  history-level: audit
  process-definition-location-prefix: classpath*:/bpmn/
  process-definition-location-suffixes:
    - "**.bpmn20.xml"
  idm:
    enabled: false
  database-schema-update: true
  # 禁用不需要的引擎，避免多引擎共享 ACT_GE_PROPERTY 表时 Liquibase 执行时序冲突
  app:
    enabled: false
  eventregistry:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false
  form:
    enabled: false

mybatis:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.bank.branch.platform: DEBUG
    root: INFO

knife4j:
  enable: true
  setting:
    language: zh_cn

platform:
  slow-sql-threshold-ms: 5000
  method-timing-warn-ms: 500
  method-timing-error-ms: 5000
