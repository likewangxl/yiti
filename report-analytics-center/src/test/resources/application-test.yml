spring:
  datasource:
    # 复用 perf 模块的同款本地 MySQL 测试库 onepl_test_bootstrap，跨模块一致
    url: jdbc:mysql://localhost:3306/onepl_test_bootstrap?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  main:
    allow-bean-definition-overriding: true
  cache:
    type: none

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.bank.branch.platform.report: DEBUG
    org.mybatis: INFO
    org.springframework.jdbc: INFO
    org.springframework.transaction: INFO
